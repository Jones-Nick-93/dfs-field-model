[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dfs-field-model"
version = "0.2.0"
description = "Lineup-level field modeling, diagnostics, and calibration for DFS contests"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
]

[project.optional-dependencies]
app = [
  "streamlit>=1.42,<1.51",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "streamlit>=1.42,<1.51",
]

[project.scripts]
dfs-field-report = "analyze_field:main"
dfs-field-demo = "demo_field:main"

[tool.setuptools]
packages = ["field_model"]
py-modules = ["analyze_field", "app", "demo_field"]

[tool.setuptools.package-data]
field_model = ["demo_data/*.csv"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
